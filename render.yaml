services:
  - type: web
    name: audittrace-demo
    runtime: python
    plan: free
    # 官方年报源可用时照常校验并建库；Render 收到官方 HTTP 403 时只降级标准样例，继续发布公开演示站。
    buildCommand: pip install -r backend/requirements.txt && python -m backend.app.connectivity_bootstrap --allow-missing-sources
    startCommand: uvicorn backend.app.connectivity_app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      # 个人竞赛演示：取消登录、每日token、次数和频率配额。
      - key: AUDITTRACE_SINGLE_USER
        value: "true"
      - key: AUDITTRACE_PUBLIC_DEMO
        value: "true"
      - key: AUDITTRACE_DEMO_MODE
        value: "true"
      - key: AUDITTRACE_PUBLIC_QUOTA_SECRET
        generateValue: true
      - key: AUDITTRACE_PERSISTENCE
        value: local
      - key: AUDITTRACE_DEMO_TASK_PERSISTENCE
        value: supabase
      # 五Agent生产入口；2026-10-26已执行逐请求额度迁移。
      - key: CONNECTIVITY_MATTER_ENABLED
        value: "true"
      - key: AUDITTRACE_DEMO_EXECUTOR_MODE
        value: web
      - key: AUDITTRACE_DEMO_TASK_RETENTION_HOURS
        value: "720"
      - key: AUDITTRACE_DEMO_TASK_LEASE_SECONDS
        value: "180"
      - key: AUDITTRACE_PROVIDER_PROBE_ENABLED
        value: "true"
      - key: AUDITTRACE_DEMO_USE_EXTERNAL_MODEL
        value: "true"
      - key: AUDITTRACE_MODEL_CACHE_SECONDS
        value: "86400"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-flash
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
