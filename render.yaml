services:
  - type: web
    name: audittrace-demo
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && python -m backend.app.public_demo_bootstrap && python -m backend.app.public_catalog_bootstrap
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: AUDITTRACE_PUBLIC_DEMO
        value: "true"
      - key: AUDITTRACE_DEMO_MODE
        value: "true"
      - key: AUDITTRACE_PUBLIC_QUOTA_SECRET
        generateValue: true
      - key: AUDITTRACE_PERSISTENCE
        value: local
      - key: AUDITTRACE_DEMO_TASK_PERSISTENCE
        value: supabase
      - key: AUDITTRACE_DEMO_EXECUTOR_MODE
        value: web
      - key: AUDITTRACE_DEMO_TASK_RETENTION_HOURS
        value: "168"
      - key: AUDITTRACE_DEMO_TASK_LEASE_SECONDS
        value: "180"
      - key: AUDITTRACE_PROVIDER_PROBE_ENABLED
        value: "true"
      - key: AUDITTRACE_DEMO_USE_EXTERNAL_MODEL
        value: "true"
      - key: AUDITTRACE_MODEL_RUN_WINDOW_SECONDS
        value: "900"
      - key: AUDITTRACE_MODEL_RUN_LIMIT
        value: "2"
      - key: AUDITTRACE_MODEL_RUN_GLOBAL_LIMIT
        value: "10"
      - key: AUDITTRACE_MODEL_MAX_CONCURRENT
        value: "2"
      - key: AUDITTRACE_MODEL_DAILY_RUN_LIMIT
        value: "60"
      - key: AUDITTRACE_MODEL_DAILY_INPUT_TOKENS
        value: "1400000"
      - key: AUDITTRACE_MODEL_DAILY_OUTPUT_TOKENS
        value: "150000"
      - key: AUDITTRACE_MODEL_CACHE_SECONDS
        value: "86400"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
