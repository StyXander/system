services:
  - type: web
    name: audittrace-demo
    runtime: python
    plan: free
    # 官方年报源可用时照常校验并建库；Render 收到官方 HTTP 403 时只降级标准样例，继续发布公开演示站。
    buildCommand: pip install -r backend/requirements.txt && python -m backend.app.public_demo_bootstrap --allow-missing-sources && python -m backend.app.public_catalog_bootstrap
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: AUDITTRACE_PUBLIC_DEMO
        value: "true"
      - key: AUDITTRACE_DEMO_MODE
        value: "true"
      - key: AUDITTRACE_PUBLIC_QUOTA_SECRET
        generateValue: true
      - key: AUDITTRACE_PERSISTENCE
        value: local
      - key: AUDITTRACE_DEMO_TASK_PERSISTENCE
        value: supabase
      - key: AUDITTRACE_DEMO_EXECUTOR_MODE
        value: web
      - key: AUDITTRACE_DEMO_TASK_RETENTION_HOURS
        value: "168"
      - key: AUDITTRACE_DEMO_TASK_LEASE_SECONDS
        value: "180"
      - key: AUDITTRACE_PROVIDER_PROBE_ENABLED
        value: "true"
      - key: AUDITTRACE_DEMO_USE_EXTERNAL_MODEL
        value: "true"
      # 2026-09-23：评委公开试用窗口，按队长决定放宽演示上限。受控默认档为
      # 每来源 2 / 全局 10 / 并发 2 / 日 60 次 / 日 140 万入 15 万出 token；
      # 试用窗口结束后应调回该默认档，费用兜底始终是 DeepSeek 账户本身。
      - key: AUDITTRACE_MODEL_RUN_WINDOW_SECONDS
        value: "900"
      - key: AUDITTRACE_MODEL_RUN_LIMIT
        value: "100"
      - key: AUDITTRACE_MODEL_RUN_GLOBAL_LIMIT
        value: "500"
      - key: AUDITTRACE_MODEL_MAX_CONCURRENT
        value: "6"
      - key: AUDITTRACE_MODEL_DAILY_RUN_LIMIT
        value: "1000"
      - key: AUDITTRACE_MODEL_DAILY_INPUT_TOKENS
        value: "40000000"
      - key: AUDITTRACE_MODEL_DAILY_OUTPUT_TOKENS
        value: "4000000"
      - key: AUDITTRACE_MODEL_CACHE_SECONDS
        value: "86400"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
