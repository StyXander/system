services:
  - type: web
    name: audittrace-demo
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && python -m backend.app.public_demo_bootstrap
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: AUDITTRACE_PUBLIC_DEMO
        value: "true"
      - key: AUDITTRACE_PERSISTENCE
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_PRIVATE_BUCKET
        value: audittrace-private
      - key: SUPABASE_SIGNED_URL_SECONDS
        value: "600"
      - key: AUDITTRACE_MODEL_RUN_WINDOW_SECONDS
        value: "900"
      - key: AUDITTRACE_MODEL_RUN_LIMIT
        value: "2"
      - key: AUDITTRACE_MODEL_RUN_GLOBAL_LIMIT
        value: "40"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
  - type: worker
    name: audittrace-worker
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m backend.app.worker
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: AUDITTRACE_PERSISTENCE
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_PRIVATE_BUCKET
        value: audittrace-private
      - key: SUPABASE_SIGNED_URL_SECONDS
        value: "600"
      - key: AUDITTRACE_PUBLIC_DEMO
        value: "true"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
