[pytest]
testpaths = backend/tests
pythonpath = .
# 不要把 basetemp 钉在仓库目录内：该目录一旦被别的沙箱令牌创建过就删不动，
# pytest 会话开始时清理它会以 PermissionError 打断大量测试；而且每坏一次换个
# 新名字规避，就会在仓库根留下一个永久垃圾目录。留空即用操作系统临时目录。
addopts = -ra
markers =
    requires_full_corpus: 需要标准股份年报全文才可运行；评委包内按边界跳过
    repository_only: 只在源码仓库可运行，不随任何交付包分发
filterwarnings =
    default
