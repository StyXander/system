name: Repository regression
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      AUDITTRACE_DEMO_USE_EXTERNAL_MODEL: "false"
      AUDITTRACE_DEMO_EXECUTOR_MODE: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Quick release contract
        run: python -m pytest backend/tests/test_release_contract.py -q --junitxml=outputs/ai4/smoke.xml
      - name: Full regression
        run: python -m pytest -q --junitxml=outputs/ai4/full.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-evidence
          path: outputs/ai4/*.xml
