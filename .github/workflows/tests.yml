name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 最小权限：只需要读代码。本工作流不引用任何仓库 Secret，
# 因此来自外部 Fork 的 PR 也不会获得任何凭据。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Quick contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUDITTRACE_DEMO_USE_EXTERNAL_MODEL: "false"
      AUDITTRACE_DEMO_EXECUTOR_MODE: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Contract tests
        run: python -m pytest backend/tests/test_release_contract.py -q --junitxml=reports/contract.xml

      - name: Upload contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-report
          path: reports/contract.xml
          if-no-files-found: warn
          retention-days: 7

  regression:
    name: Full regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: contract
    env:
      AUDITTRACE_DEMO_USE_EXTERNAL_MODEL: "false"
      AUDITTRACE_DEMO_EXECUTOR_MODE: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Full test suite
        run: python -m pytest -q --junitxml=reports/regression.xml

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: reports/regression.xml
          if-no-files-found: warn
          retention-days: 7

  frontend-contract:
    name: Frontend state contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Node built-in test runner
        run: node --test tests/frontend/connectivity-status.test.mjs
