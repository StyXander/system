name: Baosteel source-backed acceptance
# Uses live official PDF bytes; results are not seeded in the case configuration.
on:
  push:
    branches: [feature/baosteel-finals-20261027]
    paths: [.github/workflows/baosteel-source-acceptance.yml]
permissions:
  contents: read
jobs:
  verify-real-pdfs:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install production extraction dependencies
        run: pip install fastapi pydantic pymupdf httpx python-dotenv numpy
      - name: Inspect official files and calculate only source-derived values
        shell: bash
        run: |
          python - <<'PY'
          import json,traceback
          from pathlib import Path
          from backend.app.connectivity_project_demo import build_baosteel_dossier
          root=Path.cwd()
          try:
              d=build_baosteel_dossier(root)
              print('CASE_TITLE',d['title'],flush=True)
              print('COVERAGE',json.dumps([{'doc':c['document_id'],'pages':c.get('total_pages'),'bad':len(c.get('failed_pages',[])),'cache':c.get('cache_hit')} for c in d['coverage']],ensure_ascii=False),flush=True)
              print('EVIDENCE',json.dumps([{'doc':e['document_id'],'page':e['pdf_page'],'aliases':e['matched_terms']} for e in d['evidence']],ensure_ascii=False),flush=True)
              print('RECONCILIATION',json.dumps(d['reconciliation'],ensure_ascii=False),flush=True)
              out=root/'outputs'/'baosteel-source-acceptance.json'
              out.parent.mkdir(exist_ok=True)
              out.write_text(json.dumps(d,ensure_ascii=False,indent=2),encoding='utf-8')
          except Exception as e:
              print('CASE_ERROR',type(e).__name__,str(e)[:300],flush=True)
              traceback.print_exc()
              raise
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baosteel-source-acceptance
          path: outputs/baosteel-source-acceptance.json
